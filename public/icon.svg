<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="60%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <radialGradient id="highlight" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FED7AA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#C2410C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded card for maskable/app icon -->
  <rect width="512" height="512" rx="100" fill="#111111"/>

  <!-- Subtle glow ring -->
  <circle cx="256" cy="275" r="170" fill="#F97316" opacity="0.15" />

  <!-- Orange Fruit Body -->
  <circle cx="256" cy="285" r="150" fill="url(#orangeGrad)" filter="url(#shadow)"/>
  <circle cx="256" cy="285" r="150" fill="url(#highlight)"/>

  <!-- Citrus Segment Texture Subtle -->
  <circle cx="256" cy="285" r="128" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="16 14" opacity="0.4"/>
  <circle cx="256" cy="285" r="28" fill="#FFF7ED" opacity="0.9"/>
  <circle cx="256" cy="285" r="14" fill="#F97316"/>

  <!-- Stem & Leaf -->
  <path d="M256 145 C256 110, 246 95, 230 85" fill="none" stroke="#78350F" stroke-width="14" stroke-linecap="round"/>
  <!-- Leaf -->
  <path d="M250 115 C295 90, 350 110, 360 145 C320 165, 275 145, 250 115 Z" fill="url(#leafGrad)"/>
  <path d="M250 115 C305 130, 345 135, 360 145" fill="none" stroke="#15803D" stroke-width="3"/>

  <!-- Fresh Juice Splash / Sparkle -->
  <circle cx="370" cy="210" r="8" fill="#FDBA74"/>
  <circle cx="140" cy="240" r="6" fill="#FDBA74"/>
</svg>
